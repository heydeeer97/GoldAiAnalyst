
name: Build Gold AI Analyst APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify launcher icons
        run: |
          set -e
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            test -s app/src/main/res/mipmap-$density/ic_launcher.png
            test -s app/src/main/res/mipmap-$density/ic_launcher_round.png
          done
          echo "Launcher icons verified!"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Analyst-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
